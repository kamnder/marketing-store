
name: Build Marketing Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/main.dart"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --platforms=android --project-name marketing_app marketing_app

      - name: Copy Marketing app code
        run: cp lib/main.dart marketing_app/lib/main.dart

      - name: Build APK
        working-directory: marketing_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marketing-Android-APK
          path: marketing_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
