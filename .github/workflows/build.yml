name: Build For You Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/main.dart"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter Android project
        run: flutter create --platforms=android --project-name for_you_store for_you_store
      - name: Add WhatsApp link dependency
        working-directory: for_you_store
        run: flutter pub add url_launcher
      - name: Copy store app code
        run: cp lib/main.dart for_you_store/lib/main.dart
      - name: Replace generated template test
        working-directory: for_you_store
        run: |
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:for_you_store/main.dart';

          void main() {
            testWidgets('For You storefront renders', (tester) async {
              await tester.pumpWidget(const ForYouApp());
              expect(find.text('For You'), findsOneWidget);
              expect(find.text('تسوق حسب القسم'), findsOneWidget);
            });
          }
          EOF
      - name: Set app display name
        working-directory: for_you_store
        run: |
          sed -i 's/android:label="for_you_store"/android:label="For You"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="for_you_store"/android:label="For You"/' android/app/src/debug/AndroidManifest.xml || true
          sed -i 's/android:label="for_you_store"/android:label="For You"/' android/app/src/profile/AndroidManifest.xml || true
      - name: Analyze
        working-directory: for_you_store
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: for_you_store
        run: flutter test
      - name: Build release APK
        working-directory: for_you_store
        run: flutter build apk --release
      - name: Verify APK exists
        run: test -s for_you_store/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: For-You-Android-APK
          path: for_you_store/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
